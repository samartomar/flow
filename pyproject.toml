[project]
name = "flow"
version = "0.3.0"
description = "Local English dictation with a talk-to-it refine loop"
requires-python = ">=3.12"
# A public repo with no licence is all-rights-reserved: nobody may legally use what
# they can read. MIT, chosen 2026-08-01, because the audience is developers who will
# vendor a piece of this into their own tooling and the licence should not be the thing
# they have to think about.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samar Tomar" }]
# R16: keep this list at three. GUI, global hotkeys and text injection all come
# from the stdlib (tkinter, ctypes) precisely so this table does not grow.
dependencies = [
    "faster-whisper>=1.1",
    "sounddevice>=0.4.7",
    "numpy>=2",
]

# R16 holds: a default install still fetches three packages and runs on the CPU. This is
# the CUDA 12 runtime CTranslate2 links against at *decode* time, and it is an extra
# because it is roughly a gigabyte of DLLs that a machine without an NVIDIA GPU has no
# use for. With it, `asr.cuda_ready()` finds the libraries under `site-packages/nvidia`
# and the decode moves to the GPU — which is worth about six times the speed and lets the
# strongest model drive both tiers. Without it, nothing changes and nothing breaks.
#
#     uv pip install -e ".[cuda]"
#
# Pinned only by major version, because the constraint that matters is CTranslate2's
# (CUDA 12, cuDNN 9) and not a specific patch of either.
#
# `voice` is the second engine for spoken replies, and it is an extra for the same reason
# and by the same reading of R16: a default install still fetches three packages. What it
# buys is the only thing that can improve the voice at all — `speak.installed_voices`
# records why. Every voice Windows will enumerate is the 2013 `MSTTS_V110` generation, and
# the natural voices Windows 11 installs are unreachable by any public API, so no amount
# of installing Windows voices changes the reply.
#
#     uv pip install -e ".[voice]"
#     python -m piper.download_voices en_GB-cori-high --data-dir ~/.flow/voices
#
# Prefer this over `[edge]` below unless you specifically want the Microsoft voices: it
# synthesises locally, so nothing leaves the machine and no reply waits on a connection.
# It is also the engine that works on macOS, where there is no SAPI half at all.
#
# Not pinned tighter than a major version: what this depends on is `PiperVoice.load` and
# `synthesize()` yielding chunks with `audio_int16_bytes`, which `TestPiperReal` checks
# against whatever is actually installed rather than against a version number.
[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12",
    "nvidia-cudnn-cu12>=9",
]
voice = [
    "piper-tts>=1.6",
]
# `edge` is the one part of Flow that sends anything off the machine, which is why it is
# an extra you have to ask for and why `flow/edge.py` says so in its first paragraph. It
# reaches the natural voices Windows installs for Narrator and then makes unreachable —
# see `speak.installed_voices` for the mechanism. No API key and no account; what leaves
# is the text of each spoken reply, and only once you have both installed this and chosen
# one of its voices. ASR, corrections and refinement stay local either way.
#
#     uv pip install -e ".[edge]"
#
# `av` is not listed because it is already here: faster-whisper depends on it, so the MP3
# the service returns can be decoded without adding a wheel anyone was not downloading.
edge = [
    "edge-tts>=7.2",
]

[project.scripts]
flow = "flow.__main__:main"

# `uv tool install git+…/flow` is the documented install, so the repository URL is not
# decoration — it is the address in the command people are asked to run. The second is
# where Flow is listed for the audience it was published for.
[project.urls]
Repository = "https://github.com/samartomar/flow"
Listing = "https://github.com/samartomar/ai-harness"

# R16 is about *runtime* dependencies, and this does not touch them: hatchling is fetched
# into an isolated build environment and never enters the venv Flow runs in. Checked, not
# assumed — the installed distribution count is unchanged by this block.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flow"]

# The sdist is what `uv tool install git+…/flow` builds, and it shipped everything in the
# tree: **15,603,458 B and 384 files** measured on 2026-08-03, against 19 files and 536 KB
# of `flow/`. Two directories were 93% of it, and the size was the smaller half of the
# problem — `.bench/` is recorded speech, which is a recording of the person who recorded
# it, and `.claude/` is a working directory nobody installing this has any business
# receiving. The rest is this project talking to itself: a plan, a queue, a decision log
# and its history are worth reading in the repo and are not part of an install.
#
# Excluded rather than whitelisted because hatchling's sdist default is "the tree", and an
# include list would need editing every time the product grows a directory — the failure
# would be a missing file at install time, which is quieter than a large download.
# `tests/test_packaging.py` builds the real artifact and checks both halves: that none of
# this is in it, and that `flow/` still is.
[tool.hatch.build.targets.sdist]
exclude = [
    ".bench/",
    ".claude/",
    "tests/",
    "LOOP_PLAN.md",
    "NEEDS_YOU.md",
    "docs/decisions.md",
    "docs/history/",
]

[tool.uv]
# Installed, and editable — so `uv run flow` works while an edit to flow/*.py still takes
# effect on the next run with no reinstall. This was `package = false`, which meant the
# `flow` console script did not exist and `uv run flow` died on the relative imports in
# __main__.py, which is the invocation --help itself was printing.
package = true
