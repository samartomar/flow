<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    body {
      margin: 0;
      background: #23262b;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #7AA2F7; } a:hover { color: #a8c1fa; }
    .shell { width: 420px; background: #1A1D23; border: 1px solid #0B0D10;
             border-radius: 18px; }
    .inner { border: 1px solid #2E323B; border-radius: 17px; padding: 16px 16px 14px; }
    .send { height: 26px; padding: 0 14px; border-radius: 13px; background: #EAECF1;
            color: #15171C; font-size: 12px; font-weight: 600;
            display: flex; align-items: center; }
    .cmd { width: 26px; height: 26px; border-radius: 13px; background: #22262E;
           display: flex; align-items: center; justify-content: center; }
    /* One hue each, matched chroma and lightness, and clear of Flow's state hues. */
    .refine   { stroke: oklch(0.80 0.12 85); }
    .continue { stroke: oklch(0.80 0.12 200); }
    .edit     { stroke: oklch(0.80 0.12 340); }
    .command  { stroke: oklch(0.80 0.12 130); }
    .ico { width: 16px; height: 16px; display: block; }
    .body { font-size: 14px; line-height: 17px; color: #E6E8ED; margin: 0;
            text-wrap: pretty; }
    .cap { font-size: 11px; letter-spacing: .4px; color: #656B78;
           text-transform: uppercase; margin-bottom: 8px; }
    .why { font-size: 12px; line-height: 17px; color: #949AA6; margin: 8px 0 0 0;
           max-width: 420px; }
    .rule { height: 51px; border-left: 2px solid #2E323B; padding-left: 8px; }
  </style>
</helmet>

<div style="padding: 40px; display: flex; flex-direction: column; gap: 28px">

  <sc-for list="{{cases}}" as="case" hint-placeholder-count="3">
    <div>
      <div class="cap">{{case.cap}}</div>
      <div class="shell">
        <div class="inner">
          <div style="display: flex; gap: 12px; align-items: flex-start">
            <div style="flex-grow: 1">
              <div class="rule">
                <p class="body">{{case.text}}</p>
              </div>
            </div>
            <div style="display: flex; gap: 6px; flex-shrink: 0">
              <div class="cmd">
                <svg class="ico refine" viewBox="0 0 16 16" fill="none"
                     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9.5 3.2 3 9.7v3.1h3.1l6.5-6.5z"></path>
                  <path d="M11 1.5v2.2M12.1 2.6h-2.2"></path>
                </svg>
              </div>
              <div class="cmd">
                <svg class="ico continue" viewBox="0 0 16 16" fill="none"
                     stroke-width="1.4" stroke-linecap="round">
                  <path d="M8 3.4v9.2M3.4 8h9.2"></path>
                </svg>
              </div>
              <div class="cmd">
                <svg class="ico edit" viewBox="0 0 16 16" fill="none"
                     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11.4 2.6a1.6 1.6 0 0 1 2.2 2.2L5.5 12.9l-3 .8.8-3z"></path>
                </svg>
              </div>
              <div class="cmd">
                <svg class="ico command" viewBox="0 0 16 16" fill="none"
                     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 6V4a2 2 0 1 0-2 2h2M10 6V4a2 2 0 1 1 2 2h-2M6 10v2a2 2 0 1 1-2-2h2M10 10v2a2 2 0 1 0 2-2h-2M6 6h4v4H6z"></path>
                </svg>
              </div>
            </div>
          </div>
          <div style="display: flex; justify-content: flex-end; margin-top: 14px">
            <div class="send">Send</div>
          </div>
        </div>
      </div>
      <p class="why">{{case.why}}</p>
    </div>
  </sc-for>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":520,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cases: [
        {
          cap: 'One line spoken',
          text: 'This is really interesting.',
          why: 'The text area keeps its three lines. The panel does not shrink to one, '
             + 'so the window is the same shape before and after you speak.',
        },
        {
          cap: 'Three lines — the area full',
          text: 'This is really interesting. The commands moved to the corner, so the '
              + 'words get the width they were always competing for.',
          why: 'Three lines of Plex Sans at 17px is 51px. Below the rule on the left, '
             + 'you can see at a glance how much of it you filled.',
        },
        {
          cap: 'More than three — it grows, a line at a time',
          text: 'This is really interesting. The commands moved to the corner, so the '
              + 'words get the width they were always competing for, and the panel grows '
              + 'upward from a foot that never moves as you keep going.',
          why: 'Past three lines the panel steps up by whole lines to the ceiling, then '
             + 'windows to the tail. The foot stays put, so Send never moves.',
        },
      ],
    };
  }
}
</script>
</body>
</html>
