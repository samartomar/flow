<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap">
  <style>
    body {
      margin: 0;
      background: #23262b;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #7AA2F7; } a:hover { color: #a8c1fa; }
    .shell { width: 420px; background: #1A1D23; border: 1px solid #0B0D10;
             border-radius: 8px; overflow: hidden; }
    .inner { border: 1px solid #2E323B; border-bottom: 0; border-radius: 7px 7px 0 0; }
    .row-inner { border: 1px solid #2E323B; border-top: 0; border-radius: 0 0 7px 7px; }
    .chip { height: 26px; padding: 0 12px; border-radius: 13px; background: #22262E;
            color: #C7CBD4; font-size: 12px; font-weight: 500;
            display: flex; align-items: center; }
    .send { height: 26px; padding: 0 14px; border-radius: 13px; background: #EAECF1;
            color: #15171C; font-size: 12px; font-weight: 600;
            display: flex; align-items: center; }
    .body { font-size: 14px; line-height: 17px; color: #E6E8ED; margin: 0; }
    .note { font-size: 11px; line-height: 14px; color: #949AA6; }
    .trace { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px;
             letter-spacing: 1.6px; color: #949AA6; }
    .ico { width: 16px; height: 16px; display: block; }
    .app { font-size: 11px; color: #949AA6; width: 72px; }
    .tag { position: absolute; top: 12px; left: 40px; font-size: 11px;
           letter-spacing: .4px; color: #656B78; text-transform: uppercase; }
  </style>
</helmet>

<div style="padding: 40px; display: flex; justify-content: center; position: relative">
  <div class="tag">Today</div>
  <div class="shell">

    <div class="inner" style="padding: 13px">
      <p class="body">This is really interesting.</p>
      <div class="note" style="margin-top: 24px">dropped 'So' (filler, ns=0.63 lp=-0.53, final)</div>
      <div style="display: flex; gap: 8px; align-items: center; margin-top: 6px">
        <div class="chip">Refine</div>
        <div class="chip">Continue</div>
        <div style="flex-grow: 1"></div>
        <div class="send">Send</div>
      </div>
    </div>

    <div class="row-inner" style="height: 40px; display: flex; align-items: center;
                                  gap: 12px; padding: 0 12px">
      <div class="app">WindowsTe&#8230;</div>
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="#949AA6" stroke-width="1.5"
           stroke-linecap="round">
        <path d="M8 2.5a1.8 1.8 0 0 1 1.8 1.8v3a1.8 1.8 0 0 1-3.6 0v-3A1.8 1.8 0 0 1 8 2.5z"
              fill="#949AA6" stroke="none"></path>
        <path d="M4.4 7.6a3.6 3.6 0 0 0 7.2 0M8 11.2v2.3"></path>
      </svg>
      <div style="display: flex; align-items: center; gap: 2px; flex-grow: 1">
        <sc-for list="{{bars}}" as="bar" hint-placeholder-count="12">
          <div style="width: 4px; border-radius: 2px; background: #949AA6;
                      height: {{bar.h}}"></div>
        </sc-for>
      </div>
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="#949AA6" stroke-width="1.4"
           stroke-linecap="round">
        <circle cx="8" cy="8" r="2.6"></circle>
        <path d="M8 1.6v1.8M8 12.6v1.8M1.6 8h1.8M12.6 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"></path>
      </svg>
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="#949AA6" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h2l3-2.6v9.2L5 10H3z" fill="#949AA6" stroke="#949AA6"></path>
        <path d="M10.6 5.8a3 3 0 0 1 0 4.4M12.6 4a5.4 5.4 0 0 1 0 8"></path>
      </svg>
      <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="#949AA6" stroke-width="1.5"
           stroke-linecap="round">
        <path d="M2.6 5h10.8M2.6 8h10.8M2.6 11h6.6"></path>
      </svg>
      <div class="trace" style="margin-left: 4px">HELD</div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":500,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const h = [4, 7, 5, 9, 12, 8, 14, 10, 6, 9, 5, 3];
    return { bars: h.map((n) => ({ h: n + 'px' })) };
  }
}
</script>
</body>
</html>
