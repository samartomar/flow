<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231A1D23'/%3E%3Crect x='12.5' y='6' width='7' height='13' rx='3.5' fill='none' stroke='%23E6E8ED' stroke-width='2'/%3E%3Cpath d='M8.5 15.5a7.5 7.5 0 0 0 15 0M16 23v3.5' fill='none' stroke='%23E6E8ED' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Flow">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Flow</span></div>
    <div id="nav" class="nav"></div>
    <div id="status" class="status" aria-live="polite"></div>
  </nav>
  <main id="page" class="page" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="gone" class="gone" hidden>
  <div class="gone-card">
    <h1>Flow is not running</h1>
    <p id="gone-why">This window belongs to a Flow that has quit. Start Flow, then open Flow Home from the pill's menu.</p>
  </div>
</div>
</body>
</html>
